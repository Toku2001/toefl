  <style>
    :root {
      --bg-a: #f4f1ea;
      --bg-b: #e6dfd2;
      --ink: #1e2328;
      --muted: #5f6973;
      --panel: #fffdf8;
      --line: #d9d1c2;
      --accent: #0f5c74;
      --accent-2: #0c495d;
      --ok: #1f8f63;
      --warn: #bf5a2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;

      font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", sans-serif;
      background:

    }

    .hero {
      padding: 16px 18px;
      background: linear-gradient(150deg, rgba(15,92,116,0.08), rgba(255,255,255,0.85));
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-2); }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    .panel {
      padding: 14px;
    }

    .episode {
      border: 1px solid var(--line);

      margin: 0;

    }

      border-radius: 999px;

      color: var(--muted);

    .ep-controls {
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px dashed var(--line);

    }

    .ep-body {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .english {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 1.03rem;

    .vocab-panel {

  <div class="wrap">
    <section class="hero">
      <h1>TOEFL Story Immersion - 5 Episodes</h1>
      <p class="sub">最初は英語だけで読み、必要なときだけ和訳を開く設計です。1日1エピソードを目安に進めると、語彙に毎日触れやすくなります。</p>

  <script>
    const LS = "toefl_story_immersion_v1";
    const today = new Date().toISOString().slice(0, 10);
    let hideVocabMeaning = true;

    const stories = [
      {
        id: 1,
        title: "Episode 1: The Library Under Neon Rain",
        english: `Neon rain blurred every sign in Harbor District when Mina received a paper ticket with no sender name. The ticket led her to an underground library where each book contained one erased memory from the city. A curator in a copper coat told her the library had a simple mission: recover true stories before false stories took over public life.

Mina started in Room Seven, where memories were stored as floating glass chips. She watched clips of teachers bargaining for solar batteries, nurses sharing medicine during a blackout, and students painting flood maps on school walls. The city was messy, tired, and brilliant. It had survived not because people agreed all the time, but because they kept meeting, arguing, and trying again.

At midnight, the alarm rang. Someone was replacing verified records with polished fakes. In the central hall, Mina found a trail of silver ink that pointed to the old observatory. There she met a young engineer who confessed he had edited records to hide a budget scandal. "If people see the full report," he said, "they will lose hope." Mina answered, "Hope built on lies collapses faster than any bridge."

They returned to the library and reopened the original archive. Volunteers arrived from every district, reading, translating, and cross-checking data until dawn. By sunrise, citizens had posted a public timeline that showed both mistakes and repairs. It was imperfect, but it was real.

Before leaving, Mina pinned a training card on the wall: remember, discuss, verify, revise, repeat. The curator laughed and said, "Not glamorous, but powerful." Mina stepped into the rain feeling oddly light. Truth had not solved everything, yet it had given the city a direction.

Before going home, Mina wrote three review questions for tomorrow. That quiet ritual, repeated nightly, made the story practical instead of decorative.`,
        japanese: `港湾地区に降るネオン色の雨の夜、ミナは差出人不明の紙チケットを受け取る。案内されたのは地下図書館で、そこには「街から消えた記憶」が本として保存されていた。館長は、偽りの物語に街が飲み込まれる前に、本当の記録を取り戻すのが使命だと告げる。

ミナは記憶チップの部屋で、停電時に薬を分け合った看護師や、洪水地図を描く学生たちの記録を見る。街が生き延びた理由は、完璧な合意ではなく、何度も対話し直したことだった。

深夜、誰かが検証済み記録を偽造データに置き換えていることが判明する。観測所で若い技師は、予算不正を隠すため改ざんしたと告白する。ミナは「嘘の上の希望は、橋より早く崩れる」と返す。

夜明けまでに市民ボランティアは原本を復旧し、失敗と修復の両方を含む公開年表を作成した。不完全でも本物であることが、次の一歩を生む。

帰る前にミナは「記憶する・議論する・検証する・修正する・繰り返す」と壁に残す。さらに翌日の振り返り質問を3つ書く習慣が、物語を実践へ変えていく。`
      },
      {
        id: 2,
        title: "Episode 2: The Museum of Borrowed Futures",
        english: `Mina joined the Museum of Borrowed Futures, where failed inventions from the future were displayed with warning labels. The director believed prototypes that failed were useful teachers, because they showed where confidence moved faster than caution.

One hall contained a climate mirror that cooled one district while overheating another. Another hall showed a translation headset that performed perfectly but erased local accents. Mina guided students through each machine and asked the same question: not only what a device can do, but who might be excluded by it.

A sponsor later demanded that "negative stories" be removed from exhibits. Funding was fragile, and the director hesitated. Mina proposed an open-design compromise: keep the flaws visible, and invite sponsors and citizens to fix them publicly. The cameras were on, students were watching, and the sponsor accepted.

Within weeks, engineers and residents redesigned the prototypes. The climate mirror gained fairness rules, and the language headset preserved accent diversity. The museum changed from a warning chamber into a collaboration engine.

At closing time, Mina wrote on the blackboard, "Technology is policy in hardware form." Visitors copied the line into notebooks and promised to return.

Before going home, she completed a short reflection: evidence first, ego later, revision always.`,
        japanese: `ミナは「借りものの未来博物館」で働き始める。そこには未来から来た失敗作が警告ラベル付きで展示され、館長は「失敗した試作機こそ最良の教師だ」と言う。

ある展示は一地区を冷やす代わりに別地区を過熱させる気候ミラー、別の展示は翻訳精度は高いが方言を消してしまうヘッドセットだった。ミナは学生に「何ができるか」だけでなく「誰が排除されるか」を考えさせる。

やがてスポンサーは「ネガティブな物語を消せ」と要求する。資金難の中、ミナは妥協案を出す。欠陥は隠さず公開し、スポンサーと市民が同じ場で修正する設計実験へ変えるのだ。

数週間で機器は改善され、博物館は警告の場から共創の場へ変わる。閉館時、ミナは黒板に「技術はハードウェア化された政策」と書き、来館者はそれをメモして帰っていく。

最後にミナは「証拠を先に、見栄は後に、改訂は常に」という反省メモを残す。`
      },
      {
        id: 3,
        title: "Episode 3: The Train That Runs Through Dreams",
        english: `At midnight, the Dreamline crossed the city without fixed tracks. People boarded carrying one question they could not solve alone. Mina volunteered as a listener conductor, pairing strangers whose problems might unlock each other.

A farmer worried about declining soil sat beside a game designer studying motivation loops. A public defender spoke with a biology teacher researching stress and memory. Unexpectedly, practical answers emerged from unlikely pairs.

At Station Nine, the train lost power inside a tunnel. Screens went dark, voices rose, and panic spread quickly. Mina switched to a lantern session: one person names one challenge, another offers one action possible within twenty-four hours. No speeches, no heroes, only clear next steps.

When power returned, the carriage felt calmer than before. The next morning, several passengers launched a public board called Next Step. Every post needed a measurable goal, one partner, and one review date. Within months, the board became a city habit.

As dawn touched the river, Mina wrote a final prompt on the carriage wall: name the pattern, test the pattern, teach the pattern.

Before sleeping, she reviewed the day and marked one tiny action she would repeat tomorrow.`,
        japanese: `真夜中、固定線路を持たないドリームラインが街を横断する。乗客は「一人では解けない問い」を持ち込む。ミナは聞き手の車掌として、互いの問題を開けそうな他人同士を組み合わせる。

土壌劣化に悩む農家と動機設計を研究するゲームデザイナー、公選弁護人と記憶研究の教師。意外な組み合わせから実践的な答えが生まれていく。

第9駅付近で停電が起き、トンネル内で車内は不安に包まれる。ミナはランタン方式に切り替え、「課題を1つ言う」「24時間以内の行動を1つ返す」という最小手順で場を立て直す。

復電後、乗客たちは翌朝「Next Step」掲示板を立ち上げる。投稿条件は、測定可能な目標・協力者1人・見直し日1つ。数か月で市民習慣になった。

夜明けにミナは「パターンを名づけ、試し、教える」と壁に書く。就寝前には翌日繰り返す最小行動を1つだけ決める。`
      },
      {
        id: 4,
        title: "Episode 4: The Trial of the Moon Market",
        english: `Moon season opened with the Night Market Trial, a public theater-court where policy ideas were tested before real adoption. Teams performed short cases on flood barriers, school calendars, transport pricing, and food distribution routes.

Mina joined Team Lantern: elders, coders, students, cooks, and bus drivers. Their plan proposed turning abandoned parking towers into vertical gardens, emergency shelters, and after-school labs. Critics called it unrealistic.

During cross-examination, Mina conceded real risks and presented amendments: governance quotas by neighborhood, transparent waiting lists, and independent quarterly audits. The audience did not cheer because the proposal sounded perfect; they cheered because the team showed how to correct failure early.

After midnight, Team Lantern placed second overall. Yet their amendment package won first place in public adoption. Teenagers immediately sketched local versions for other districts.

Before closing, Mina told the crowd, "Argument is not war. Argument is maintenance for collective thinking." People laughed, argued, and kept iterating in the square.

That night she wrote one final note: good policy survives contact with criticism.`,
        japanese: `ムーンシーズンの始まりに、政策を実装前に試す公開劇場裁判「ナイトマーケット・トライアル」が開かれる。洪水対策、学期暦、運賃、食料配送などを各チームが短編劇で弁論する。

ミナのチーム・ランタンは、高齢者、学生、運転手、コーダー、料理人の混成。放棄された立体駐車場を、垂直農園・避難拠点・放課後ラボへ転換する案を提案する。

反対尋問でミナはリスクを認めた上で、地区別の運営枠、透明な待機リスト、四半期ごとの独立監査を追加する。観客が評価したのは完璧さではなく、失敗を先回りして修正する設計だった。

結果は総合2位。しかし修正パッケージは市民採択1位となり、若者たちは別地区向けの派生案を描き始める。

閉会前、ミナは「議論は戦争ではない。共同思考の保守点検だ」と語る。夜、彼女は「良い政策は批判との接触に耐える」とノートに書いた。`
      },
      {
        id: 5,
        title: "Episode 5: The City That Remembers Your Name",
        english: `In the oldest district, buildings stored personal memories in their walls. Locals called it the City That Remembers Your Name. Doors opened to polite voices, and streetlights brightened when neighbors greeted one another.

Then names began disappearing. With each missing name, access failed: medicine cabinets, legal files, family letters. Rumors spread that a private firm wanted to replace the district with luxury towers.

Mina assembled a repair circle of archivists, electricians, grandparents, and teenagers fluent in legacy code. The investigation found no grand sabotage. The real cause was neglected maintenance and postponed updates.

They divided the district into blocks, trained local stewards, and published a transparent repair log. Trust returned gradually, porch by porch.

On the final night, residents held a naming ceremony in the plaza. Children read restored names, elders told migration stories, and musicians played songs thought to be lost.

At midnight, every streetlight turned gold as voices spoke together. Mina understood the project was never about nostalgia alone. It was about systems that keep people visible to one another.

Before leaving, she wrote a simple line at the city gate: shared memory needs shared responsibility.`,
        japanese: `最古の地区では、建物の壁が個人記憶を保存していた。住民はそこを「あなたの名前を覚える街」と呼ぶ。丁寧に呼びかけると扉が開き、挨拶が交わされると街灯が明るくなる。

だが、名前が一つずつ消え始める。名前が失われるたび、薬庫、法務記録、家族の手紙へのアクセスが失敗する。再開発企業の噂が広がり、地区は不安定になる。

ミナは記録係、電気技師、高齢住民、レガシーコードに強い若者で修復チームを編成する。調査の結論は破壊工作ではなく、長年の保守不足だった。

地区をブロック分割し、地元管理者を育成し、修理ログを公開すると、信頼は玄関先ごとに少しずつ戻る。

最後の夜、広場で命名式が開かれる。子どもは復元された名前を読み上げ、長老は移住の歴史を語り、失われたと思われた歌が再び演奏される。

真夜中、街灯は一斉に金色へ変わる。ミナは悟る。これは懐古だけの計画ではない。人が互いを見失わないための制度設計なのだ。最後に門へ「共有記憶には共有責任が必要」と書き残す。`
      }
    ];

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(LS) || "{}");
      } catch {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(LS, JSON.stringify(state));
    }

    function ensureState() {
      const s = loadState();
      if (!s.checked) s.checked = {};
      if (!s.jpOpen) s.jpOpen = {};
      if (!s.completedDates) s.completedDates = [];
      return s;
    }

    function updateStreak(state) {
      const completedToday = stories.every((s) => !!state.checked[s.id]);
      const set = new Set(state.completedDates || []);
      if (completedToday) set.add(today);
      else set.delete(today);
      state.completedDates = Array.from(set).sort();
    }

    function streakCount(state) {
      const set = new Set(state.completedDates || []);
      let n = 0;
      while (true) {
        const d = new Date(today + "T00:00:00");
        d.setDate(d.getDate() - n);
        const key = d.toISOString().slice(0, 10);
        if (!set.has(key)) break;
        n += 1;
      }
      return n;
    }

    function render() {
      const state = ensureState();
      const root = document.getElementById("episodes");
      root.innerHTML = "";

      for (const s of stories) {
        const done = !!state.checked[s.id];
        const jpOpen = !!state.jpOpen[s.id];

        const ep = document.createElement("article");
        ep.className = "episode" + (done ? " done" : "");
        ep.innerHTML = `
          <div class="ep-head">
            <h2 class="ep-title">${s.title}</h2>
            <span class="badge">${done ? "Completed" : "In Progress"}</span>
          </div>
          <div class="ep-controls">
            <button class="toggle-jp" data-id="${s.id}">${jpOpen ? "和訳を閉じる" : "和訳を開く"}</button>
            <label class="check"><input type="checkbox" class="done-check" data-id="${s.id}" ${done ? "checked" : ""} /> 今日この章を読んだ</label>
          </div>
          <div class="ep-body">
            <div class="english">${escapeHtml(s.english).replace(/\n\n/g, "<br><br>")}</div>
            <div class="jp ${jpOpen ? "open" : ""}">${escapeHtml(s.japanese).replace(/\n\n/g, "<br><br>")}</div>
          </div>
        `;
        root.appendChild(ep);
      }

      for (const el of document.querySelectorAll(".toggle-jp")) {
        el.addEventListener("click", () => {
          const id = Number(el.dataset.id);
          const s = ensureState();
          s.jpOpen[id] = !s.jpOpen[id];
          saveState(s);
          render();
        });
      }

      for (const el of document.querySelectorAll(".done-check")) {
        el.addEventListener("change", () => {
          const id = Number(el.dataset.id);
          const s = ensureState();
          s.checked[id] = el.checked;
          updateStreak(s);
          saveState(s);
          render();
        });
      }

      const checked = stories.filter((s) => !!state.checked[s.id]).length;
      document.getElementById("progressChip").textContent = `Progress: ${checked} / ${stories.length}`;
      document.getElementById("streakChip").textContent = `Streak: ${streakCount(state)} days`;
    }

    function renderVocab() {
      const rows = Array.isArray(window.VOCAB_DATA) ? window.VOCAB_DATA : [];
      const q = document.getElementById("vocabSearch").value.trim().toLowerCase();
      const chapter = document.getElementById("chapterFilter").value;

      const filtered = rows.filter((r) => {
        if (chapter !== "all" && String(r.chapter) !== chapter) return false;
        if (!q) return true;
        return r.word.toLowerCase().includes(q) || r.meaning.toLowerCase().includes(q);
      });

      const root = document.getElementById("vocabList");
      root.innerHTML = "";

      for (const r of filtered) {
        const item = document.createElement("div");
        item.className = "vocab-item";
        item.innerHTML = `
          <div class="vocab-word">${escapeHtml(r.word)}</div>
          <div class="vocab-meaning ${hideVocabMeaning ? "hide" : ""}">${escapeHtml(r.meaning)}</div>
          <span class="mini">Ch ${r.chapter}</span>
        `;
        root.appendChild(item);
      }

      document.getElementById("vocabCount").textContent = `${filtered.length} words`;
      document.getElementById("toggleAllMeanings").textContent = hideVocabMeaning ? "意味を表示" : "意味を隠す";
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("openAllJp").addEventListener("click", () => {
      const s = ensureState();
      for (const st of stories) s.jpOpen[st.id] = true;
      saveState(s);
      render();
    });

    document.getElementById("closeAllJp").addEventListener("click", () => {
      const s = ensureState();
      for (const st of stories) s.jpOpen[st.id] = false;
      saveState(s);
      render();
    });

    document.getElementById("resetCheck").addEventListener("click", () => {
      const s = ensureState();
      s.checked = {};
      updateStreak(s);
      saveState(s);
      render();
    });

    document.getElementById("vocabSearch").addEventListener("input", renderVocab);
    document.getElementById("chapterFilter").addEventListener("change", renderVocab);
    document.getElementById("toggleAllMeanings").addEventListener("click", () => {
      hideVocabMeaning = !hideVocabMeaning;
      renderVocab();
    });

    render();
    renderVocab();
  </script>
</body>
</html>
